# The C library and runtime variants for the CH32 cores, chosen by clang's
# BareMetal driver from -march / -mabi (scripts/build-runtimes.sh builds them).
# clang normalises -march with every extension's version; the Mappings turn
# that into one tag per variant, so a board's other extensions (zmmul,
# zba/zbb/zbs) still find their library. XW (xwchc) picks the XW build of the
# same instruction set.
MultilibVersion: 1.0
Variants:
# The headers, the same for every variant: always selected.
- Dir: common
  Flags: [--target=riscv32-unknown-unknown-elf]
- Dir: rv32ec/ilp32e
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32e, -fch32-rv32ec]
- Dir: rv32ec_xwchc/ilp32e
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32e, -fch32-rv32ec-xw]
- Dir: rv32imc/ilp32
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32, -fch32-rv32imc]
- Dir: rv32imc_xwchc/ilp32
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32, -fch32-rv32imc-xw]
- Dir: rv32imac/ilp32
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32, -fch32-rv32imac]
- Dir: rv32imac_xwchc/ilp32
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32, -fch32-rv32imac-xw]
- Dir: rv32imafc/ilp32f
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32f, -fch32-rv32imafc]
- Dir: rv32imafc_xwchc/ilp32f
  Flags: [--target=riscv32-unknown-unknown-elf, -mabi=ilp32f, -fch32-rv32imafc-xw]
Mappings:
# rv32e with C, any of zicsr / zmmul (CH32V003, the V00x, M007)
- Match: -march=rv32e2p0_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zca[0-9p]+)?
  Flags: [-fch32-rv32ec]
- Match: -march=rv32e2p0_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zca[0-9p]+)?_xwchc[0-9p]+
  Flags: [-fch32-rv32ec-xw]
# rv32imc without A (CH32V205, M030)
- Match: -march=rv32i2p1_m2p0_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zca[0-9p]+)?
  Flags: [-fch32-rv32imc]
- Match: -march=rv32i2p1_m2p0_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zca[0-9p]+)?_xwchc[0-9p]+
  Flags: [-fch32-rv32imc-xw]
# rv32imac (V103 without XW; V20x / L103 / X035 / V407 with it)
- Match: -march=rv32i2p1_m2p0_a2p1_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zaamo[0-9p]+)?(_zalrsc[0-9p]+)?(_zca[0-9p]+)?
  Flags: [-fch32-rv32imac]
- Match: -march=rv32i2p1_m2p0_a2p1_c2p0(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zaamo[0-9p]+)?(_zalrsc[0-9p]+)?(_zca[0-9p]+)?_xwchc[0-9p]+
  Flags: [-fch32-rv32imac-xw]
# rv32imafc, and with B (V30x / X315 / H41x)
- Match: -march=rv32i2p1_m2p0_a2p1_f2p2_c2p0(_b[0-9p]+)?(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zaamo[0-9p]+)?(_zalrsc[0-9p]+)?(_zca[0-9p]+)?(_zcf[0-9p]+)?(_zba[0-9p]+)?(_zbb[0-9p]+)?(_zbs[0-9p]+)?
  Flags: [-fch32-rv32imafc]
- Match: -march=rv32i2p1_m2p0_a2p1_f2p2_c2p0(_b[0-9p]+)?(_zicsr[0-9p]+)?(_zmmul[0-9p]+)?(_zaamo[0-9p]+)?(_zalrsc[0-9p]+)?(_zca[0-9p]+)?(_zcf[0-9p]+)?(_zba[0-9p]+)?(_zbb[0-9p]+)?(_zbs[0-9p]+)?_xwchc[0-9p]+
  Flags: [-fch32-rv32imafc-xw]
