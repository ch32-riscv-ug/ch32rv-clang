# Build the RISC-V-only clang + lld, the target libraries (picolibc,
# compiler-rt, libc++) and GDB for every host the Arduino Boards Manager
# serves, and publish them as one GitHub release.
#
# The target libraries are the same on every host: the runtimes job builds
# them once, with upstream's own release of the same LLVM, and each host's
# package takes that tree.
#
# Run: push a tag v<package version>, or start it by hand with the package
# version. The package version is <LLVM version>-<build> (e.g. 23.1.5-1); the
# LLVM version is the part before the last '-'.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version, e.g. 23.1.5-1"
        required: true

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      llvm: ${{ steps.v.outputs.llvm }}
      pkg: ${{ steps.v.outputs.pkg }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ inputs.package_version }}"
          else
            pkg="${GITHUB_REF_NAME#v}"
          fi
          pkg="${pkg#v}"
          if ! [[ "$pkg" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "package version must be <LLVM version>-<build>, e.g. 23.1.5-1: got '$pkg'" >&2
            exit 1
          fi
          llvm="${pkg%-*}"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"

  runtimes:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install meson==1.12.1 cmake==4.4.4 ninja
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: LLVM release and source
        shell: bash
        run: |
          v="${{ needs.versions.outputs.llvm }}"
          base=https://github.com/llvm/llvm-project/releases/download/llvmorg-$v
          mkdir -p "$RUNNER_TEMP/llvm"
          curl -fsSL "$base/LLVM-$v-Linux-X64.tar.xz" | tar -xJ -C "$RUNNER_TEMP/llvm" --strip-components=1
          top=llvm-project-$v.src
          curl -fsSL "$base/$top.tar.xz" | tar -xJ -C "$RUNNER_TEMP" \
            --exclude="$top/llvm/test" --exclude="$top/clang/test" --exclude="$top/lld/test" --exclude="$top/lldb"
          echo "LLVM_SRC=$RUNNER_TEMP/$top" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          scripts/build-runtimes.sh "$RUNNER_TEMP/llvm" "$LLVM_SRC"
          tar -czf runtimes.tar.gz -C "$RUNNER_TEMP/llvm" lib/clang-runtimes include/c++ licenses
          ls -l runtimes.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes
          path: runtimes.tar.gz
          if-no-files-found: error

  build:
    needs: [versions, runtimes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake ccache m4

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # GDB on Windows is a MinGW program (GDB does not build with MSVC).
      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make m4 diffutils

      # Restored here and saved after the build even when it fails, so a run
      # that stops late (packing, the smoke test) leaves the next one fast.
      - name: ccache (restore)
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ needs.versions.outputs.llvm }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.target }}-${{ needs.versions.outputs.llvm }}-

      - name: Build
        shell: bash
        env:
          CCACHE: ${{ runner.os != 'Windows' && '1' || '0' }}
          # One place on every host (macOS's default is ~/Library/Caches/ccache).
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          LINK_JOBS: "2"
        run: scripts/build.sh "${{ needs.versions.outputs.llvm }}" "${{ needs.versions.outputs.pkg }}" "${{ matrix.target }}"

      - name: ccache (save)
        if: always() && runner.os != 'Windows'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ needs.versions.outputs.llvm }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: GDB
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build-gdb.sh work/stage/ch32rv-toolchain

      - name: GDB (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/build-gdb.sh "$(cygpath -u "$GITHUB_WORKSPACE")/work/stage/ch32rv-toolchain" x86_64-w64-mingw32

      - uses: actions/download-artifact@v4
        with:
          name: runtimes
          path: runtimes

      - name: Pack
        shell: bash
        run: scripts/pack.sh "${{ needs.versions.outputs.pkg }}" "${{ matrix.target }}" runtimes/runtimes.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*-*"
          path: dist
          merge-multiple: true
      # GDB is GPL and GMP / MPFR LGPL: their exact sources go with the binaries.
      - name: Sources
        run: |
          mkdir -p dist/sources
          scripts/build-gdb.sh --sources | while read -r url; do
            curl -fsSL -o "dist/sources/${url##*/}" "$url"
          done
          mv dist/sources/* dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.versions.outputs.pkg }}"
          ls -l dist
          gh release create "$tag" dist/* --repo "${{ github.repository }}" \
            --title "ch32rv-toolchain ${{ needs.versions.outputs.pkg }} (LLVM ${{ needs.versions.outputs.llvm }})" \
            --notes "RISC-V-only clang + lld from LLVM ${{ needs.versions.outputs.llvm }} with picolibc, compiler-rt, libc++ and GDB, for the CH32 Arduino core. See README. The gdb, gmp, mpfr and expat archives are the sources of the GDB in the packages." \
            || gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
